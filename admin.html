<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2ec">
  <title>Заказы — BESTI MOOD</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body{min-height:100vh;background:var(--paper);color:var(--ink)}.admin-wrap{width:min(1120px,calc(100% - 36px));margin:40px auto 80px}.admin-top{display:flex;align-items:center;justify-content:space-between;gap:18px;padding-bottom:22px;border-bottom:1px solid var(--line)}.admin-top h1{margin:0;font:500 clamp(30px,5vw,54px)/1 var(--display);letter-spacing:-.05em}.admin-back{color:var(--muted);font-size:12px;text-decoration:none}.admin-card{margin-top:28px;padding:24px;border:1px solid var(--line);background:#fff}.admin-auth{max-width:480px}.admin-auth form{display:grid;gap:15px}.admin-auth label{display:grid;gap:7px;color:var(--muted);font-size:12px}.admin-auth input,.admin-search{height:44px;padding:0 12px;border:1px solid var(--line);background:#fff;font:inherit}.admin-auth .button{justify-content:center;min-height:44px;cursor:pointer}.admin-error{min-height:18px;color:#9b4d58;font-size:12px}.admin-toolbar{display:flex;align-items:center;gap:12px;margin:24px 0}.admin-toolbar .admin-search{flex:1;min-width:200px}.admin-toolbar button{min-height:42px;padding:0 16px;border:1px solid var(--ink);background:var(--ink);color:#fff;font:inherit;font-size:12px;cursor:pointer}.admin-toolbar .admin-logout{background:transparent;color:var(--ink)}.admin-table-wrap{overflow:auto;border:1px solid var(--line);background:white}.admin-table{width:100%;border-collapse:collapse;min-width:980px;font-size:12px}.admin-table th,.admin-table td{padding:12px 13px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.admin-table th{background:#f5f2ec;font-weight:600}.admin-table td{line-height:1.5}.admin-order-num{font-weight:700;white-space:nowrap}.admin-muted{color:var(--muted)}.admin-empty{padding:30px;text-align:center;color:var(--muted)}
    @media(max-width:600px){.admin-wrap{width:calc(100% - 24px);margin-top:22px}.admin-card{padding:16px}.admin-toolbar{flex-wrap:wrap}.admin-toolbar .admin-search{flex-basis:100%}.admin-top h1{font-size:34px}}
  </style>
</head>
<body>
  <main class="admin-wrap">
    <header class="admin-top"><div><p class="eyebrow">BESTI MOOD · УПРАВЛЕНИЕ</p><h1>Заказы</h1></div><a class="admin-back" href="index.html">← На сайт</a></header>
    <section class="admin-card admin-auth" id="admin-auth">
      <p class="auth-intro">Войдите по рабочей почте и паролю аккаунта с правами менеджера.</p>
      <form id="admin-login-form"><label>Почта менеджера<input type="email" name="email" autocomplete="username" required></label><label>Пароль<input type="password" name="password" autocomplete="current-password" required></label><p class="admin-error" id="admin-auth-error" aria-live="polite"></p><button class="button button-dark" type="submit">Войти</button></form>
    </section>
    <section id="admin-orders" hidden>
      <div class="admin-toolbar"><input class="admin-search" id="admin-search" type="search" placeholder="Номер заказа, имя, телефон или Telegram"><button id="admin-export" type="button">Скачать для Excel</button><button class="admin-logout" id="admin-logout" type="button">Выйти</button></div>
      <p class="admin-error" id="admin-list-error" aria-live="polite"></p>
      <div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Номер / дата</th><th>Покупатель</th><th>Контакты</th><th>Telegram</th><th>Состав заказа</th><th>Сумма</th><th>Статус</th></tr></thead><tbody id="admin-order-rows"></tbody></table><div class="admin-empty" id="admin-empty" hidden>Заказы не найдены</div></div>
    </section>
  </main>
  <script src="supabase-client.js"></script>
  <script src="admin.js"></script>
</body>
</html>
