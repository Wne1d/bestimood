<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2ec">
  <title>Заказы — BESTI MOOD</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body{min-height:100vh;background:var(--paper);color:var(--ink)}.admin-wrap{width:min(1120px,calc(100% - 36px));margin:40px auto 80px}.admin-top{display:flex;align-items:center;justify-content:space-between;gap:18px;padding-bottom:22px;border-bottom:1px solid var(--line)}.admin-top h1{margin:0;font:500 clamp(30px,5vw,54px)/1 var(--display);letter-spacing:-.05em}.admin-back{color:var(--muted);font-size:12px;text-decoration:none}.admin-card{margin-top:28px;padding:24px;border:1px solid var(--line);background:#fff}.admin-auth{max-width:480px}.admin-auth form{display:grid;gap:15px}.admin-auth label{display:grid;gap:7px;color:var(--muted);font-size:12px}.admin-auth input,.admin-search{height:44px;padding:0 12px;border:1px solid var(--line);background:#fff;font:inherit}.admin-auth .button{justify-content:center;min-height:44px;cursor:pointer}.admin-error{min-height:18px;color:#9b4d58;font-size:12px}.admin-toolbar{display:flex;align-items:center;gap:12px;margin:24px 0}.admin-toolbar .admin-search{flex:1;min-width:200px}.admin-toolbar button{min-height:42px;padding:0 16px;border:1px solid var(--ink);background:var(--ink);color:#fff;font:inherit;font-size:12px;cursor:pointer}.admin-toolbar .admin-logout{background:transparent;color:var(--ink)}.admin-table-wrap{overflow:auto;border:1px solid var(--line);background:white}.admin-table{width:100%;border-collapse:collapse;min-width:980px;font-size:12px}.admin-table th,.admin-table td{padding:12px 13px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.admin-table th{background:#f5f2ec;font-weight:600}.admin-table td{line-height:1.5}.admin-order-num{font-weight:700;white-space:nowrap}.admin-muted{color:var(--muted)}.admin-empty{padding:30px;text-align:center;color:var(--muted)}
    .admin-tabs{display:flex;align-items:center;gap:22px;margin:24px 0 18px;border-bottom:1px solid var(--line)}.admin-tab{padding:0 0 12px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font:inherit;cursor:pointer}.admin-tab.is-active{border-color:var(--ink);color:var(--ink)}.admin-tabs .admin-logout{margin-left:auto;padding:8px 12px;border:1px solid var(--line);background:transparent;color:var(--ink)}.product-toolbar{display:flex;gap:12px;margin:0 0 16px}.product-toolbar .admin-search{flex:1;min-width:170px}.product-toolbar button,.product-row button,.product-form-actions button{min-height:40px;padding:0 14px;border:1px solid var(--ink);background:var(--ink);color:white;font:inherit;font-size:12px;cursor:pointer}.product-table{min-width:720px}.product-thumb{width:48px;height:58px;object-fit:cover;background:#eee}.product-edit-form{margin:20px 0;padding:20px;background:#f7f5f1;border:1px solid var(--line)}.product-edit-form[hidden]{display:none}.product-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.product-edit-form label{display:grid;gap:6px;color:var(--muted);font-size:11px}.product-edit-form input,.product-edit-form select,.product-edit-form textarea{width:100%;min-height:40px;padding:9px 10px;border:1px solid var(--line);background:white;color:var(--ink);font:inherit;font-size:12px}.product-edit-form textarea{min-height:90px;resize:vertical}.product-field-wide{grid-column:1/-1}.product-stock-grid{display:grid;grid-template-columns:repeat(5,minmax(64px,1fr));gap:8px;margin-top:7px}.product-checks{display:flex;flex-wrap:wrap;gap:16px}.product-checks label{display:flex;align-items:center;gap:7px}.product-checks input{width:15px;min-height:15px}.product-form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}.product-form-actions .secondary{background:transparent;color:var(--ink)}.product-form-message{min-height:16px;margin:12px 0 0;color:#9b4d58;font-size:11px}.product-row .archive-product{border-color:#9b4d58;background:white;color:#9b4d58}.product-row .delete-product{border-color:#9b4d58;background:transparent;color:#9b4d58}.product-row .delete-product:hover{background:#9b4d58;color:#fff}.admin-toolbar #admin-export{background:transparent;color:var(--ink)}
    @media(max-width:600px){.admin-wrap{width:calc(100% - 24px);margin-top:22px}.admin-card{padding:16px}.admin-toolbar{flex-wrap:wrap}.admin-toolbar .admin-search{flex-basis:100%}.admin-top h1{font-size:34px}.product-form-grid{grid-template-columns:1fr}.product-stock-grid{grid-template-columns:repeat(3,minmax(64px,1fr))}.product-field-wide{grid-column:auto}.product-toolbar{flex-wrap:wrap}.product-toolbar .admin-search{flex-basis:100%}}
  </style>
</head>
<body>
  <main class="admin-wrap">
    <header class="admin-top"><div><p class="eyebrow">BESTI MOOD · УПРАВЛЕНИЕ</p><h1>Заказы</h1></div><a class="admin-back" href="index.html">← На сайт</a></header>
    <section class="admin-card admin-auth" id="admin-auth">
      <p class="auth-intro">Войдите по рабочей почте и паролю аккаунта с правами менеджера.</p>
      <form id="admin-login-form"><label>Почта менеджера<input type="email" name="email" autocomplete="username" required></label><label>Пароль<input type="password" name="password" autocomplete="current-password" required></label><p class="admin-error" id="admin-auth-error" aria-live="polite"></p><button class="button button-dark" type="submit">Войти</button></form>
    </section>
    <section id="admin-orders" hidden>
      <nav class="admin-tabs" aria-label="Управление магазином"><button class="admin-tab is-active" type="button" data-admin-tab="orders">Заказы</button><button class="admin-tab" type="button" data-admin-tab="products">Товары</button><button class="admin-logout" id="admin-logout" type="button">Выйти</button></nav>
      <div id="orders-view">
      <div class="admin-toolbar"><input class="admin-search" id="admin-search" type="search" placeholder="Номер заказа, имя, телефон или Telegram"><button id="admin-export" type="button">Скачать для Excel</button></div>
      <p class="admin-error" id="admin-list-error" aria-live="polite"></p>
      <div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Номер / дата</th><th>Покупатель</th><th>Контакты</th><th>Telegram</th><th>Состав заказа</th><th>Сумма</th><th>Статус</th></tr></thead><tbody id="admin-order-rows"></tbody></table><div class="admin-empty" id="admin-empty" hidden>Заказы не найдены</div></div>
      </div>
      <div id="products-view" hidden>
        <div class="product-toolbar"><input class="admin-search" id="product-search" type="search" placeholder="Поиск по артикулу или названию"><button id="product-add" type="button">Добавить товар</button><button id="product-refresh" type="button">Обновить</button></div>
        <p class="admin-error" id="product-list-error" aria-live="polite"></p>
        <form class="product-edit-form" id="product-form" hidden>
          <div class="product-form-grid">
            <label>Артикул (SKU)<input name="sku" required maxlength="40" placeholder="Например, OUT-025"></label>
            <label>Название<input name="name" required maxlength="180"></label>
            <label>Цена, ₽<input name="price" type="number" min="0" step="1"></label>
            <label>Категория<select name="group" required><option value="outerwear">Верхняя одежда</option><option value="tops">Кофты</option><option value="bottoms">Штаны</option><option value="sets">Костюмы</option><option value="jackets">Пиджаки</option></select></label>
            <label>Подкатегория<input name="subcategory" maxlength="100" placeholder="Например, Куртки"></label>
            <label>Тип размеров<select name="sizeMode"><option value="sized">XS–XL</option><option value="one">Единый размер</option></select></label>
            <div class="product-field-wide"><span>Остатки по размерам (штук)</span><div class="product-stock-grid" id="sized-stock-fields"><label>XS<input name="stockXS" type="number" min="0" step="1" value="0"></label><label>S<input name="stockS" type="number" min="0" step="1" value="0"></label><label>M<input name="stockM" type="number" min="0" step="1" value="0"></label><label>L<input name="stockL" type="number" min="0" step="1" value="0"></label><label>XL<input name="stockXL" type="number" min="0" step="1" value="0"></label></div><label id="one-size-field" hidden>Единый размер<input name="oneSizeStock" type="number" min="0" step="1" value="0"></label></div>
            <label>Состав<input name="fabric" maxlength="500" placeholder="Можно оставить пустым"></label>
            <label>Артикул формы<select name="shape"><option value="coat">Верхняя одежда</option><option value="top">Кофта</option><option value="pants">Брюки</option><option value="set">Костюм</option></select></label>
            <label class="product-field-wide">Описание<textarea name="description" maxlength="2000"></textarea></label>
            <label>Метка на карточке<input name="tag" maxlength="30" placeholder="Например, ХИТ"></label>
            <label>Фото товара<input name="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple></label>
            <label class="product-field-wide">Текущие фото (ссылки, по одной на строку)<textarea name="images" placeholder="После загрузки фото ссылки появятся здесь"></textarea></label>
            <div class="product-field-wide product-checks"><label><input name="hit" type="checkbox"> Хит</label><label><input name="newItem" type="checkbox"> Новинка</label><label><input name="sale" type="checkbox"> Распродажа</label><label><input name="isActive" type="checkbox" checked> Показывать в каталоге</label></div>
          </div>
          <p class="product-form-message" id="product-form-message" aria-live="polite"></p>
          <div class="product-form-actions"><button class="secondary" id="product-cancel" type="button">Отмена</button><button type="submit">Сохранить товар</button></div>
        </form>
        <div class="admin-table-wrap"><table class="admin-table product-table"><thead><tr><th>Фото</th><th>Артикул / название</th><th>Цена</th><th>Остатки</th><th>Статус</th><th></th></tr></thead><tbody id="product-rows"></tbody></table><div class="admin-empty" id="product-empty" hidden>Товары не найдены</div></div>
      </div>
    </section>
  </main>
  <script src="supabase-client.js?v=20261026-delete-product"></script>
  <script src="admin.js?v=20261026-delete-product"></script>
</body>
</html>
